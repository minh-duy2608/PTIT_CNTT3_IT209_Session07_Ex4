<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông Tin Học Viên - IT209</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 48px 56px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeInUp 0.7s ease both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #6c63ff, #a78bfa);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 999px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 32px;
            line-height: 1.3;
        }

        h1 span {
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 36px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            transition: background 0.2s;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .info-item .icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .info-item .label {
            font-size: 0.72rem;
            color: #a78bfa;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .info-item .value {
            font-size: 1.05rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 0 0 28px;
        }

        .server-info {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.7;
        }

        .server-info strong {
            color: #60a5fa;
        }

        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #34d399;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1);   }
            50%       { opacity: 0.5; transform: scale(1.4); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">IT209 &mdash; Bài tập 4</div>

        <h1>Trang Chủ <span>Học Viên</span></h1>

        <div class="info-grid">
            <div class="info-item">
                <span class="icon">👤</span>
                <div>
                    <div class="label">Họ và Tên</div>
                    <div class="value">[Họ Tên Học Viên]</div>
                </div>
            </div>
            <div class="info-item">
                <span class="icon">🎓</span>
                <div>
                    <div class="label">Mã Lớp</div>
                    <div class="value">[Mã Lớp]</div>
                </div>
            </div>
            <div class="info-item">
                <span class="icon">📚</span>
                <div>
                    <div class="label">Môn Học</div>
                    <div class="value">IT209 &mdash; Triển khai ứng dụng</div>
                </div>
            </div>
        </div>

        <hr class="divider" />

        <div class="server-info">
            <span class="status-dot"></span>
            Máy chủ <strong>Nginx</strong> đang hoạt động &mdash; Port <strong>80</strong><br />
            Static files phục vụ từ <strong>/var/www/html/</strong><br />
            API Reverse Proxy &rarr; Spring Boot <strong>:8082</strong>
        </div>
    </div>
</body>
</html>
